[pytest]
testpaths = tests
addopts = -p no:cacheprovider
markers =
    requisito(id): rastreia o caso de teste até o requisito (RTM)
    REQ01: cálculo
    REQ02: NULL vira zero
    REQ03: negativo retorna -1
    REQ04: fronteira 0,00 e épsilon
    REQ05: limite DECIMAL(12,2)
    REQ06: gravação 1 para 1
